<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; img-src 'self' data: blob:">
  <title>Hangar</title>
  <link rel="stylesheet" href="../../node_modules/@xterm/xterm/css/xterm.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header id="bar">
    <button id="btn-menu" class="btn icon" title="Menu (Alt)" aria-label="Menu" hidden>
      <svg viewBox="0 0 16 16"><path d="M2.5 4h11M2.5 8h11M2.5 12h11"/></svg>
    </button>
    <div id="summary" class="summary" aria-live="polite"></div>
    <div class="grow"></div>
    <button id="usage" class="usage" title="Usage (⇧⌘Y)" aria-label="Usage"></button>
    <button id="btn-new" class="btn primary" title="New session or terminal (⌘N)">
      <svg viewBox="0 0 16 16"><path d="M8 3v10M3 8h10"/></svg><span>New</span>
    </button>
    <button id="btn-overseer" class="btn ov-btn" title="Overseer (⇧⌘O)" aria-pressed="false">
      <svg viewBox="0 0 16 16"><path d="M1.5 8s2.4-4.5 6.5-4.5S14.5 8 14.5 8 12.1 12.5 8 12.5 1.5 8 1.5 8z"/><circle cx="8" cy="8" r="2"/></svg><span>Overseer</span>
    </button>
    <button id="btn-settings" class="btn icon" title="Settings" aria-label="Settings">
      <svg viewBox="0 0 16 16"><path d="M2.5 4.5h11M2.5 11.5h11"/><circle cx="10.5" cy="4.5" r="1.6" class="fill"/><circle cx="5.5" cy="11.5" r="1.6" class="fill"/></svg>
    </button>
  </header>

  <main id="main">
    <section id="stage">
      <div id="dropzone">Drop a folder to start a new session there</div>
      <div id="empty" class="empty">
        <div class="empty-inner">
          <div class="empty-title">Drop a project folder here</div>
          <div class="empty-sub">or press <kbd id="kbd-new">⌘N</kbd> to start a Claude Code session</div>
          <div id="empty-recent" class="recent-list"></div>
        </div>
      </div>
    </section>
    <aside id="overseer">
      <div class="ov-head">
        <svg class="ov-eye" viewBox="0 0 16 16" aria-hidden="true"><path d="M1.5 8s2.4-4.5 6.5-4.5S14.5 8 14.5 8 12.1 12.5 8 12.5 1.5 8 1.5 8z"/><circle cx="8" cy="8" r="2"/></svg>
        <span class="ov-title">Overseer</span>
        <span id="ov-model" class="ov-model"></span>
        <div class="grow"></div>
        <button id="ov-view" class="btn icon small" aria-label="Clean view"><svg viewBox="0 0 16 16"><path d="M3 4.5A1.5 1.5 0 0 1 4.5 3h7A1.5 1.5 0 0 1 13 4.5v5a1.5 1.5 0 0 1-1.5 1.5H7l-3 2.5V11h0A1.5 1.5 0 0 1 3 9.5z"/></svg></button>
        <button id="ov-new" class="btn small" title="Start a fresh conversation">New chat</button>
        <button id="ov-close" class="btn icon small" title="Close" aria-label="Close overseer"><svg viewBox="0 0 16 16"><path d="M4 4l8 8M12 4l-8 8"/></svg></button>
      </div>
      <div id="ov-term" class="term"></div>
      <div id="ov-chat"></div>
    </aside>
  </main>

  <div id="layer"></div>

  <script src="../../node_modules/@xterm/xterm/lib/xterm.js"></script>
  <script src="../../node_modules/@xterm/addon-fit/lib/addon-fit.js"></script>
  <script src="../../node_modules/@xterm/addon-unicode11/lib/addon-unicode11.js"></script>
  <script src="../../node_modules/@xterm/addon-webgl/lib/addon-webgl.js"></script>
  <script src="layout.js"></script>
  <script src="chat.js"></script>
  <script src="app.js"></script>
</body>
</html>
