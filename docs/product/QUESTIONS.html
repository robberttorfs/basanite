<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Plan questions</title>
<style>
  :root { --bg:#14151a; --card:#1c1e25; --line:#2a2d36; --text:#e6e7ea; --muted:#8b8f9a; --accent:#e0a33a; }
  @media (prefers-color-scheme: light) { :root { --bg:#f6f6f4; --card:#fff; --line:#e3e3df; --text:#1d1e22; --muted:#6b6e76; --accent:#b26b00; } }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width:760px; margin:0 auto; padding:40px 16px 120px; }
  h1 { font-size:22px; font-weight:600; margin:0 0 28px; }
  .q { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:16px 18px; margin-bottom:12px; }
  .q h2 { font-size:15px; font-weight:600; margin:0 0 10px; }
  .q h2 span { color:var(--muted); font-weight:400; margin-right:6px; }
  label { display:flex; gap:10px; align-items:flex-start; padding:5px 0; cursor:pointer; }
  input[type=radio] { accent-color:var(--accent); margin-top:4px; }
  .rec { color:var(--accent); font-size:12px; margin-left:6px; }
  textarea { width:100%; min-height:44px; margin-top:8px; background:transparent; color:var(--text); border:1px solid var(--line); border-radius:6px; padding:8px; font:inherit; resize:vertical; }
  .bar { position:fixed; left:0; right:0; bottom:0; background:var(--card); border-top:1px solid var(--line); padding:12px 16px; display:flex; justify-content:center; gap:12px; }
  button { background:var(--accent); color:#111; border:0; border-radius:8px; padding:9px 18px; font:600 14px system-ui, sans-serif; cursor:pointer; }
  #ok { color:var(--muted); align-self:center; font-size:13px; }
</style>
</head>
<body>
<main>
<h1>Plan questions</h1>
<div id="qs"></div>
</main>
<div class="bar"><button id="copy">Copy answers</button><span id="ok"></span></div>
<script>
const Q = [
  ['Workspace switcher', ['Pills in the top bar, hidden with one workspace', 'Thin rail on the left', 'Dropdown with the workspace name'], 0],
  ['Overview screen', ['Attention list with preview (needs you first)', 'Grid of status cards', 'Both, with a toggle'], 0],
  ['Other agents (Codex, Gemini CLI)', ['Claude Code only', 'Later, after 1.0', 'In 1.0'], 0],
  ['Phone alerts (opt-in, through a free relay like ntfy)', ['No', 'Later, opt-in', 'In 1.0, opt-in'], 1],
  ['Own branch (git worktree) on New', ['Optional checkbox', 'Leave it out'], 0],
  ['Notification sound', ['Optional, off by default', 'Never', 'On by default'], 0],
  ['Website for launch', ['One landing page + docs page', 'Only a landing page', 'GitHub README only for now'], 0],
  ['Licence', ['MIT', 'Apache-2.0'], 0],
  ['The current private hangar repo', ['Keep private as history', 'Make it public too', 'Archive it'], 0],
  ['Windows palette key Ctrl+Shift+K (Fresh start loses its shortcut)', ['Yes', 'Pick another key'], 0],
  ['Theme default', ['Follow the system', 'Always dark unless changed'], 0],
  ['Compact density setting', ['Yes, two values', 'No'], 0],
  ['Usage history chart', ['Yes, in the Usage popover', 'No'], 0],
  ['Same-file warning between sessions', ['Yes', 'No'], 0],
  ['Name style', ['One calm real word (like Hangar)', 'Invented short word', 'Descriptive (two words)'], 0],
];
const root = document.getElementById('qs');
Q.forEach(([title, opts, rec], i) => {
  const d = document.createElement('div'); d.className = 'q';
  d.innerHTML = `<h2><span>${i + 1}</span>${title}</h2>` + opts.map((o, j) =>
    `<label><input type="radio" name="q${i}" value="${o}"${j === rec ? ' checked' : ''}>${o}${j === rec ? '<span class="rec">recommended</span>' : ''}</label>`).join('') +
    `<textarea data-n="${i}" placeholder="Note"></textarea>`;
  root.appendChild(d);
});
document.getElementById('copy').onclick = async () => {
  const lines = Q.map(([title], i) => {
    const v = document.querySelector(`input[name=q${i}]:checked`)?.value || '-';
    const n = document.querySelector(`textarea[data-n="${i}"]`).value.trim();
    return `${i + 1}. ${title}: ${v}${n ? ` (${n})` : ''}`;
  });
  try { await navigator.clipboard.writeText(lines.join('\n')); document.getElementById('ok').textContent = 'Copied. Paste it into the chat.'; }
  catch { document.getElementById('ok').textContent = 'Copy failed, select the page text instead.'; }
};
</script>
</body>
</html>
