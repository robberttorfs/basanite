<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Name picker</title>
<style>
  :root { --bg:#111216; --card:#191b21; --line:#272a33; --text:#e8e9ec; --muted:#868a95; --faint:#5a5e69; --amber:#e3a33b; --top:#15161b; }
  @media (prefers-color-scheme: light) { :root { --bg:#f4f4f1; --card:#fff; --line:#e2e2dd; --text:#1b1c20; --muted:#686b73; --faint:#a3a6ad; --amber:#b26b00; --top:#fafaf8; } }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width:1100px; margin:0 auto; padding:36px 16px 110px; }
  h1 { font-size:20px; font-weight:600; margin:0 0 6px; }
  .filters { display:flex; gap:8px; flex-wrap:wrap; margin:18px 0 22px; }
  .filters button { background:transparent; color:var(--muted); border:1px solid var(--line); border-radius:99px; padding:5px 12px; font:13px system-ui, sans-serif; cursor:pointer; }
  .filters button.on { color:var(--text); border-color:var(--text); }
  .grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(320px, 1fr)); gap:14px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; overflow:hidden; display:flex; flex-direction:column; }
  .card.fav { border-color:var(--amber); }
  .bar { background:var(--top); border-bottom:1px solid var(--line); height:34px; display:flex; align-items:center; gap:8px; padding:0 12px; font-size:12px; color:var(--muted); }
  .dots { display:flex; gap:5px; margin-right:6px; } .dots i { width:9px; height:9px; border-radius:50%; background:var(--line); }
  .bar b { color:var(--text); font-weight:600; font-size:13px; letter-spacing:.01em; }
  .bar .st { margin-left:auto; display:flex; gap:10px; } .bar .st span::before { content:''; display:inline-block; width:7px; height:7px; border-radius:50%; margin-right:5px; vertical-align:1px; }
  .bar .st .a::before { background:var(--amber); box-shadow:0 0 6px var(--amber); } .bar .st .w::before { background:#5aa9e6; }
  .body { padding:22px 18px 16px; flex:1; }
  .mark { font-size:34px; font-weight:650; letter-spacing:-.02em; line-height:1.1; }
  .say { color:var(--faint); font-size:13px; margin-top:3px; }
  .mean { color:var(--muted); font-size:14px; margin-top:12px; }
  .foot { display:flex; align-items:center; gap:10px; padding:0 18px 16px; }
  .dl { background:var(--text); color:var(--bg); border-radius:8px; padding:7px 14px; font-size:13px; font-weight:600; }
  .tag { color:var(--faint); font-size:12px; }
  .heart { margin-left:auto; background:none; border:1px solid var(--line); color:var(--muted); border-radius:8px; width:36px; height:32px; cursor:pointer; font-size:16px; }
  .card.fav .heart { color:var(--amber); border-color:var(--amber); }
  .ref { opacity:.55; }
  .tray { position:fixed; left:0; right:0; bottom:0; background:var(--card); border-top:1px solid var(--line); padding:12px 16px; display:flex; justify-content:center; align-items:center; gap:14px; }
  .tray button { background:var(--amber); color:#111; border:0; border-radius:8px; padding:9px 18px; font:600 14px system-ui, sans-serif; cursor:pointer; }
  #picked { color:var(--muted); font-size:13px; max-width:60vw; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
</style>
</head>
<body>
<main>
<h1>Name picker</h1>
<div class="filters" id="filters"></div>
<div class="grid" id="grid"></div>
</main>
<div class="tray"><span id="picked">None picked</span><button id="copy">Copy picks</button></div>
<script>
const N = [
  ['Tessera', 'TESS-er-a', 'Reference for the feel. Taken by a competing app.', 'Reference', true],
  // Stone and material, like Obsidian
  ['Basalt', 'BASS-alt', 'Dark volcanic rock. Hard, dense, quietly serious.', 'Stone & material'],
  ['Flint', 'FLINT', 'The stone that strikes the spark. Short and sharp.', 'Stone & material'],
  ['Lodestone', 'LODE-stone', 'The magnetic stone that points the way.', 'Stone & material'],
  ['Zircon', 'ZUR-kon', 'A hard, brilliant crystal. Crisp and technical.', 'Stone & material'],
  ['Cinder', 'SIN-der', 'Still glowing after the fire. Dark, warm, sharp.', 'Stone & material'],
  ['Onyx', 'ON-iks', 'Black banded stone. Sleek.', 'Stone & material'],
  // Crafted real words, like Raycast or Linear
  ['Sigil', 'SIJ-il', 'A mark with power. Rare, sharp, a bit mysterious.', 'Crafted word'],
  ['Quillon', 'KWIL-on', 'The crossguard of a sword. Almost nobody knows it.', 'Crafted word'],
  ['Halyard', 'HAL-yard', 'The line that hoists the sail. Crafted, nautical, pro.', 'Crafted word'],
  ['Parallax', 'PAR-a-lax', 'Seeing one thing from many points at once.', 'Crafted word'],
  ['Spire', 'SPIRE', 'The sharp top of a tower. Clean and tall.', 'Crafted word'],
  ['Oriel', 'OR-ee-el', 'A bay window that juts out to see further.', 'Crafted word'],
  ['Kestrel', 'KES-trel', 'A fast, precise falcon.', 'Crafted word'],
  // Invented, like Vercel, Figma or Ghostty
  ['Vorta', 'VOR-ta', 'Invented. Strong start, open ending.', 'Invented'],
  ['Kovra', 'KOV-ra', 'Invented. Hard consonants, compact.', 'Invented'],
  ['Velith', 'VEL-ith', 'Invented. Smooth, a little elegant.', 'Invented'],
  ['Corvane', 'kor-VANE', 'Invented, from corvus (raven) + vane. Sharp and watchful.', 'Invented'],
  ['Taliq', 'TAL-ik', 'Invented. Short, unusual ending, very ownable.', 'Invented'],
  ['Arcline', 'ARK-line', 'Invented compound. Clean and tool-like.', 'Invented'],
  ['Ovra', 'OV-ra', 'Invented. Four letters, easy to say anywhere.', 'Invented'],
];
let favs = new Set(), filter = 'All';
const groups = ['All', ...new Set(N.map((n) => n[3]))];
const fl = document.getElementById('filters'), grid = document.getElementById('grid');
function draw() {
  fl.innerHTML = groups.map((g) => `<button class="${g === filter ? 'on' : ''}" data-g="${g}">${g}</button>`).join('');
  fl.querySelectorAll('button').forEach((b) => b.onclick = () => { filter = b.dataset.g; draw(); });
  grid.innerHTML = N.filter((n) => filter === 'All' || n[3] === filter).map(([name, say, mean, group, ref]) => `
    <div class="card${favs.has(name) ? ' fav' : ''}${ref ? ' ref' : ''}">
      <div class="bar"><span class="dots"><i></i><i></i><i></i></span><b>${name}</b><span class="st"><span class="a">1</span><span class="w">3</span></span></div>
      <div class="body"><div class="mark">${name}</div><div class="say">${say}</div><div class="mean">${mean}</div></div>
      <div class="foot"><span class="dl">Download ${name}</span><span class="tag">${group}</span>${ref ? '' : `<button class="heart" data-n="${name}" aria-label="Like ${name}">♥</button>`}</div>
    </div>`).join('');
  grid.querySelectorAll('.heart').forEach((b) => b.onclick = () => { const n = b.dataset.n; favs.has(n) ? favs.delete(n) : favs.add(n); draw(); });
  document.getElementById('picked').textContent = favs.size ? [...favs].join(', ') : 'None picked';
}
draw();
document.getElementById('copy').onclick = async () => {
  try { await navigator.clipboard.writeText('Name picks: ' + ([...favs].join(', ') || 'none')); document.getElementById('picked').textContent = 'Copied. Paste it into the chat.'; } catch {}
};
</script>
</body>
</html>
