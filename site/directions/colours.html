<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Colour schemes, v3</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@500;600;700;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; }
  body { background: #d7d9d9; color: #111; font: 500 15px/1.45 "Schibsted Grotesk", system-ui, sans-serif; padding: 32px 16px 80px; }
  main { max-width: 1320px; margin: 0 auto; display: grid; gap: 40px; }
  h1 { font-size: 28px; font-weight: 800; letter-spacing: -.02em; }
  .scheme { display: grid; gap: 12px; }
  .scheme header { display: flex; flex-wrap: wrap; gap: 6px 16px; align-items: baseline; }
  .scheme h2 { font-size: 20px; font-weight: 800; letter-spacing: -.01em; }
  .scheme h2 em { font-style: normal; background: #111; color: #fff; padding: 1px 8px; margin-left: 8px; font-size: 13px; vertical-align: 3px; }
  .scheme p { max-width: 80ch; }
  .pair { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 520px), 1fr)); gap: 12px; }
  .mini { background: var(--bg); color: var(--text); padding: 22px 22px 24px; display: grid; gap: 18px; border-radius: 6px; overflow: hidden; }
  .mini nav { display: flex; justify-content: space-between; align-items: center; font-weight: 700; font-size: 14px; }
  .mini nav span { color: var(--muted); font-weight: 600; }
  .mini h3 { font-size: clamp(30px, 3.6vw, 44px); line-height: 1; letter-spacing: -.035em; font-weight: 800; max-width: 14ch; }
  .mini .row { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; font-size: 13px; color: var(--muted); }
  .mini .btn { background: var(--text); color: var(--bg); font-weight: 700; font-size: 14px; padding: 11px 16px; border-radius: 8px; }
  .wall { display: grid; grid-template-columns: 1fr 1.6fr 1fr; grid-template-rows: 64px 64px; gap: 8px; }
  .t { background: var(--tile); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; font: 500 12px "JetBrains Mono", monospace; color: var(--muted); display: flex; justify-content: space-between; }
  .t.hot { border-color: var(--sig); box-shadow: 0 0 0 1px var(--sig), 0 0 28px -6px var(--glow); grid-row: span 2; color: var(--text); }
  .t.hot b { color: var(--sigtext); font-weight: 500; }
  .t.you { color: var(--text); }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; font: 500 11px "JetBrains Mono", monospace; color: var(--muted); }
  .chips i { display: inline-block; width: 12px; height: 12px; vertical-align: -2px; margin-right: 4px; border: 1px solid rgba(128,128,128,.4); }
</style>
</head>
<body>
<main id="m">
  <h1>Six colour schemes for v3</h1>
</main>
<script>
// [name, line, dark tokens, light tokens|null, picked]
const S = [
  ['Runway', 'Petrol-black neutrals tinted towards blue-green (the blue the owner likes, kept in the background), with the app\'s own amber as the only signal. Night-airfield calm; amber reads exactly like the app\'s screenshots. Picked.',
    { bg:'#0A1317', tile:'#0F1B20', line:'#1E2E35', text:'#E6EDEF', muted:'#8FA2A9', sig:'#F5B545', sigtext:'#F5B545', glow:'rgba(245,181,69,.55)' },
    { bg:'#F1F4F5', tile:'#FFFFFF', line:'#D3DDE0', text:'#0A1A20', muted:'#4E6169', sig:'#E9A532', sigtext:'#8A5A00', glow:'rgba(233,165,50,.5)' }, true],
  ['Carbon', 'v2\'s set: warm carbon and bone with amber. It works and matches the app, but it is what the owner just called too much, and the warm greys drift towards beige in light mode.',
    { bg:'#0B0B0A', tile:'#121211', line:'#2A2925', text:'#ECE9E2', muted:'#9A968C', sig:'#FFB23F', sigtext:'#FFB23F', glow:'rgba(255,178,63,.5)' },
    { bg:'#EBEAE6', tile:'#FFFFFF', line:'#D6D4CD', text:'#141412', muted:'#5E5B54', sig:'#E8A23A', sigtext:'#9C5A00', glow:'rgba(232,162,58,.45)' }],
  ['Kingfisher', 'Blue as the signal: the owner\'s favourite colour and very calm. But blue reads as "link" or "working", not "needs you", and it contradicts every real screenshot, where waiting is amber.',
    { bg:'#0B1216', tile:'#101A1F', line:'#1F2E35', text:'#E4ECEF', muted:'#8DA0A8', sig:'#3DB8F0', sigtext:'#3DB8F0', glow:'rgba(61,184,240,.5)' },
    { bg:'#F4F8FA', tile:'#FFFFFF', line:'#D2DEE4', text:'#0B1B22', muted:'#4F626B', sig:'#2AA3DD', sigtext:'#0A6FA3', glow:'rgba(42,163,221,.45)' }],
  ['Vesper', 'Neutral near-black with a soft peach signal, after the Vesper editor theme. Elegant, but peach is too gentle to say "waiting on you", and pure grey gives the page no character of its own.',
    { bg:'#101010', tile:'#161616', line:'#282828', text:'#EDEDED', muted:'#A0A0A0', sig:'#FFC799', sigtext:'#FFC799', glow:'rgba(255,199,153,.45)' },
    { bg:'#F7F7F7', tile:'#FFFFFF', line:'#DDDDDD', text:'#101010', muted:'#595959', sig:'#F0AE78', sigtext:'#94531F', glow:'rgba(240,174,120,.45)' }],
  ['Sumi ink', 'Kanagawa\'s ink and carp yellow. Loved by developers and very calm, but it is someone else\'s theme, the ivory text lowers contrast, and the light version can only go towards cream.',
    { bg:'#16161D', tile:'#1F1F28', line:'#2E2E3B', text:'#DCD7BA', muted:'#9A9888', sig:'#E6C384', sigtext:'#E6C384', glow:'rgba(230,195,132,.45)' },
    { bg:'#EFEFEA', tile:'#FBFBF8', line:'#DAD9D0', text:'#1F1F28', muted:'#5A5A62', sig:'#D9AE5E', sigtext:'#836414', glow:'rgba(217,174,94,.45)' }],
  ['Hi-vis', 'A light-first poster: cool paper, ink, and a solid amber tile with ink text. The boldest in daylight, but a full amber block gets loud fast, and developers mostly arrive in dark mode.',
    { bg:'#111311', tile:'#181B18', line:'#2A2E2A', text:'#F1F3EF', muted:'#9AA097', sig:'#FFB000', sigtext:'#FFB000', glow:'rgba(255,176,0,.5)' },
    { bg:'#F4F5F2', tile:'#FFFFFF', line:'#D9DCD5', text:'#121512', muted:'#565C55', sig:'#FFB000', sigtext:'#121512', glow:'rgba(255,176,0,.0)', fill:true }],
];
const m = document.getElementById('m');
const mini = (t, mode) => {
  const vars = Object.entries(t).map(([k, v]) => `--${k}:${v}`).join(';');
  const hot = t.fill ? `style="background:${t.sig};border-color:${t.sig};color:${t.sigtext}"` : '';
  return `<div class="mini" style="${vars}">
    <nav>Hangar OSS <span>${mode}</span></nav>
    <h3>Every Claude Code session on one calm screen.</h3>
    <div class="wall">
      <div class="t">api</div><div class="t hot" ${hot}>web <b ${t.fill ? 'style="color:inherit"' : ''}>needs you</b></div><div class="t">docs</div>
      <div class="t you">scraper ▍</div><div class="t">notes ✓</div>
    </div>
    <div class="row"><span class="btn">Download for Mac</span> Windows, Intel Mac, source</div>
  </div>`;
};
for (const [name, line, d, l, pick] of S) {
  const sec = document.createElement('section');
  sec.className = 'scheme';
  const chips = Object.entries(d).filter(([k]) => !['glow', 'sigtext'].includes(k)).map(([k, v]) => `<span><i style="background:${v}"></i>${k} ${v}</span>`).join('');
  sec.innerHTML = `<header><h2>${name}${pick ? '<em>picked</em>' : ''}</h2><div class="chips">${chips}</div></header><p>${line}</p><div class="pair">${mini(d, 'dark')}${l ? mini(l, 'light') : ''}</div>`;
  m.appendChild(sec);
}
</script>
</body>
</html>
